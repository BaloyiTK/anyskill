services:
  postgres:
    image: postgres:17-alpine
    container_name: anyskill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anyskill
      POSTGRES_PASSWORD: anyskill_local_only
      POSTGRES_DB: anyskill
    ports:
      - "5432:5432"
    volumes:
      - anyskill-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anyskill -d anyskill"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: anyskill-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  anyskill-postgres-data:
