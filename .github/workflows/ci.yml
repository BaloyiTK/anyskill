name: AnySkill CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: anyskill
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anyskill"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anyskill?schema=public

      - name: Apply database migrations (including PostGIS)
        run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anyskill?schema=public

      - name: Verify PostGIS and geographic index
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/anyskill" -v ON_ERROR_STOP=1 -c "SELECT postgis_version();"
          psql "postgresql://postgres:postgres@localhost:5432/anyskill" -v ON_ERROR_STOP=1 -c "SELECT indexname FROM pg_indexes WHERE indexname = 'provider_profiles_live_geography_gist_idx';" | grep provider_profiles_live_geography_gist_idx
          psql "postgresql://postgres:postgres@localhost:5432/anyskill" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/geographic-matching.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anyskill?schema=public

      - name: Build API
        run: pnpm build:api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anyskill?schema=public

      - name: Type-check mobile app
        run: pnpm --filter @anyskill/mobile typecheck
